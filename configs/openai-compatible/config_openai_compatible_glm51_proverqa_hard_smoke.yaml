# GLM-5.1 zero-shot adaptive-agent smoke test for ProverQA hard

provider: "openai-compatible"
dataset: "ProverQA"
model: "glm-5.1"
plan_model: "glm-5.1"
code_model: "glm-5.1"
test_file: "./data/ProverQA/hard.json"
reasoning_method: "adaptive-agent"
prompt_path: "./prompts-zero-shot/ProverQA-prompts-adaptive-agent"
