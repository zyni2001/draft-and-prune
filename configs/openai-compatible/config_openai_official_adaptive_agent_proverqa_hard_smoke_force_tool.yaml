# OpenAI official zero-shot adaptive-agent smoke test for ProverQA hard + Z3
# This variant forces the ProverQA tool path for debugging.

provider: "openai-compatible"
dataset: "ProverQA"
model: "gpt-5.4"
plan_model: "gpt-5.4"
code_model: "gpt-5.4"
test_file: "./data/ProverQA/hard.json"
reasoning_method: "adaptive-agent"
prompt_path: "./prompts-zero-shot/ProverQA-prompts-adaptive-agent"
shots: "zero"
desired_indices: [0]
num_paths: 1
force_tool_name: "solve_proverqa_with_z3"

api_key: ""
openai_compatible_api_key: "${OPENAI_API_KEY}"
openai_compatible_base_url: "https://api.openai.com/v1"
openai_compatible_timeout_sec: 30
openai_compatible_default_extra_body: null
openai_compatible_extra_body: null
max_retries: 2
test_delay: 1
num_processes: 1

plan_temp: 0
code_temp: 0
max_repairs: 1

results_root: "./results"
